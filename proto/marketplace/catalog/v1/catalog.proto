syntax = "proto3";

package proto.catalog.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

option go_package = "marketplace/gen/catalogpb";

service CatalogService {
  rpc Create(CreateCatalogRequest) returns (CreateCatalogResponse);
  rpc Get(GetCatalogRequest) returns (GetCatalogResponse);
  rpc List(ListCatalogRequest) returns (ListCatalogResponse);
  rpc Update(UpdateCatalogRequest) returns (UpdateCatalogResponse);
  rpc Delete(DeleteCatalogRequest) returns (google.protobuf.Empty);
  rpc Reserve(ReserveCatalogRequest) returns (ReserveCatalogResponse);
}

message Listing {
  string id = 1;
  string seller_id = 2;
  string title = 3;
  int64 price = 4;
  int32 stock = 5;
  int32 sold = 6;
  google.protobuf.Timestamp created_at = 7;
}

message CreateCatalogRequest {
  string seller_id = 1;
  string title = 2;
  int64 price = 3;
  optional int32 stock = 4;
}

message CreateCatalogResponse {
  Listing listing = 1;
}

message GetCatalogRequest {
  string id = 1;
}

message GetCatalogResponse {
  Listing listing = 1;
}

message ListCatalogRequest {
  optional int32 limit = 1;
  optional int32 offset = 2;
}

message ListCatalogResponse {
  repeated Listing items = 1;
  int64 total = 2;
}

message UpdateCatalogRequest {
  string id = 1;
  string seller_id = 2;
  optional string title = 3;
  optional int64 price = 4;
  optional int32 stock = 5;
}

message UpdateCatalogResponse {
  Listing listing = 1;
}

message DeleteCatalogRequest {
  string id = 1;
  string seller_id = 2;
}

message DeleteCatalogResponse {}

message ReserveCatalogRequest {
  string listing_id = 1;
  int32 qty = 2;
}

message ReserveCatalogResponse {
  int32 remaining = 1;
}
